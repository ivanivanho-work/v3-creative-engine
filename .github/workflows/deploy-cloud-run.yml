name: Deploy Cloud Run Services

on:
  push:
    branches: [main]
    paths:
      - 'services/**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      agent-collective: ${{ steps.filter.outputs.agent-collective }}
      creative-generator: ${{ steps.filter.outputs.creative-generator }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            agent-collective:
              - 'services/agent-collective-v2/**'
            creative-generator:
              - 'services/creative-generator-v2/**'

  deploy-agent-collective:
    needs: detect-changes
    if: needs.detect-changes.outputs.agent-collective == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Agent Collective V2
        run: |
          gcloud run deploy agent-collective-v2 \
            --source services/agent-collective-v2 \
            --project v3-creative-engine \
            --region us-central1 \
            --memory 2Gi --cpu 2 --timeout 600 \
            --max-instances 3 --min-instances 0 \
            --set-env-vars "MARKET=kr" \
            --set-secrets "GOOGLE_API_KEY=GOOGLE_API_KEY:latest" \
            --allow-unauthenticated

  deploy-creative-generator:
    needs: detect-changes
    if: needs.detect-changes.outputs.creative-generator == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Creative Generator V2
        run: |
          gcloud run deploy creative-generator-v2 \
            --source services/creative-generator-v2 \
            --project v3-creative-engine \
            --region us-central1 \
            --memory 2Gi --cpu 2 --timeout 600 \
            --max-instances 3 --min-instances 0 \
            --set-env-vars "GCS_BUCKET=v3-creative-engine.firebasestorage.app,GCP_PROJECT_ID=v3-creative-engine,VERTEX_AI_LOCATION=us-central1" \
            --set-secrets "GOOGLE_API_KEY=GOOGLE_API_KEY:latest" \
            --allow-unauthenticated
