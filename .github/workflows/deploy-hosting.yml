name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Install all workspace dependencies from root
      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      # shorts-intel-hub uses Tailwind v4 with platform-specific native binaries
      # (lightningcss, @tailwindcss/oxide). Reinstall to get linux binaries.
      - name: Fix platform binaries for shorts-intel-hub
        working-directory: tools/shorts-intel-hub/frontend
        run: npm install --no-save

      # Build each frontend app
      - name: Build template-stamper
        working-directory: tools/template-stamper
        run: npm run build

      - name: Build shorts-brain
        working-directory: tools/shorts-brain
        run: npm run build

      - name: Build shorts-intel-hub
        working-directory: tools/shorts-intel-hub/frontend
        run: npm run build

      # Deploy to Firebase Hosting
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_V3_CREATIVE_ENGINE }}
          channelId: live
          projectId: v3-creative-engine
