name: Preview Hosting (PR)

on:
  pull_request:
    branches: [main]

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Install all workspace dependencies from root
      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      # Ensure platform-correct lightningcss binary for Tailwind v4
      - name: Fix lightningcss platform binary
        working-directory: tools/shorts-intel-hub/frontend
        run: npm install lightningcss-linux-x64-gnu --no-save 2>/dev/null || true

      - name: Build template-stamper
        working-directory: tools/template-stamper
        run: npm run build

      - name: Build shorts-brain
        working-directory: tools/shorts-brain
        run: npm run build

      - name: Build shorts-intel-hub
        working-directory: tools/shorts-intel-hub/frontend
        run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_V3_CREATIVE_ENGINE }}
          projectId: v3-creative-engine
